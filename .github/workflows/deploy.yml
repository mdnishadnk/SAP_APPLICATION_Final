name: Test EC2 SSH Login via Local Path

on:
  workflow_dispatch: # Allows you to manually trigger this workflow from the GitHub Actions tab

jobs:
  ssh-login-test:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Strict Permissions on PEM Key
        run: |
          # Ensure the private key has secure permissions required by SSH
          chmod 600 ./ubuntu.pem

      - name: Connect to EC2 via SSH and Test Login
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          # Execute standard SSH using the local workspace key file
          ssh -i ./ubuntu.pem -o StrictHostKeyChecking=no ubuntu@"$EC2_HOST" << 'EOF'
            echo "Successfully logged into EC2 instance!"
            whoami
            uname -a
            uptime
            ls /var/www/html/
          EOF
