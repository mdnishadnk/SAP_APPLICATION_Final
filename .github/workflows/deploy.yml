name: Test EC2 SSH Login

on:
  workflow_dispatch: # Allows you to manually trigger this workflow from the GitHub Actions tab

jobs:
  ssh-login-test:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Connect to EC2 via SSH and Test Login
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}        # Your EC2 Public IP or DNS
          username: ubuntu                     # Your EC2 username
          password: ${{ secrets.EC2_PASSWORD }}    # The password stored in GitHub Secrets
          port: 22                             # Default SSH port
          script: |
            echo "Successfully logged into EC2 instance!"
            whoami
            uname -a
            uptime
            ls /var/www/
