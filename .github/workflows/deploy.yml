name: Deploy MERN Stack to EC2

on:
  push:
    branches: 
      - main
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Optional: Specific Commit SHA for manual rollback'
        required: false
        type: string

jobs:
  deploy:
    runs-on: self-hosted
    # Only run if triggered manually, or if the commit message contains specific trigger words
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'Deploy Now') ||
      contains(github.event.head_commit.message, 'Roll Back')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Connect and Deploy to EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          PEM_PATH: "/home/nishad/ubuntu.pem"
        run: |
          ssh -i "$PEM_PATH" -o StrictHostKeyChecking=no ubuntu@"$EC2_HOST" << 'EOF'
            set -e
            echo "Successfully connected to EC2 instance!"
            
            # Navigate to home directory
            cd ~
            
            # Clone or update the repository and clean local conflicts
            if [ -d "SAP_APPLICATION_Final" ]; then
              echo "Repository exists. Resetting local changes and pulling latest..."
              cd SAP_APPLICATION_Final
              git reset --hard HEAD
              git clean -fd
              git pull origin main
            else
              echo "Cloning repository..."
              git clone https://github.com/mdnishadnk/SAP_APPLICATION_Final.git
              cd SAP_APPLICATION_Final
            fi

            echo "Setting up and Installing Backend dependencies..."
            cd backend
            npm install

            echo "Restarting Backend with PM2..."
            pm2 restart sap-backend || pm2 start server.js --name "sap-backend"
            pm2 save

            echo "Setting up and Building Frontend..."
            cd ../frontend
            npm install
            npm run build

            echo "Copying Frontend build assets to Nginx web root..."
            sudo rm -rf /var/www/html/*
            sudo cp -r dist/* /var/www/html/

            echo "Testing and restarting Nginx..."
            sudo nginx -t
            sudo systemctl restart nginx

            echo "Deployment/Rollback script executed successfully with zero errors!"
          EOF
