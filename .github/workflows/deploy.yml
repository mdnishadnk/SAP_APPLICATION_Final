name: Deploy MERN Stack to EC2

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Zero-Touch MERN Stack Build and Deploy
        run: |
          set -e
          echo "Starting zero-touch deployment on EC2 instance..."

          # Navigate into the checked-out repository path provided by the self-hosted runner
          cd "${{ github.workspace }}"

          echo "Ensuring clean repository state and pulling latest changes..."
          git reset --hard HEAD
          git pull origin main

          echo "Setting up and Installing Backend dependencies..."
          cd backend
          npm install

          echo "Restarting Backend with PM2..."
          pm2 restart sap-backend || pm2 start server.js --name "sap-backend"
          pm2 save

          echo "Setting up and Building Frontend..."
          cd ../frontend
          npm install
          npm run build

          echo "Copying Frontend build assets to Nginx web root..."
          sudo rm -rf /var/www/html/*
          sudo cp -r dist/* /var/www/html/

          echo "Testing and restarting Nginx..."
          sudo nginx -t
          sudo systemctl restart nginx

          echo "Deployment script executed successfully with zero errors!"
