name: Test EC2 SSH Login via Local Path

on:
  workflow_dispatch:

jobs:
  ssh-login-test:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Connect to EC2 via SSH and Test Login
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          PEM_PATH: "/media/nishad/Careers/Google_drive_copy/aws_personal_account/ubuntu.pem"
        run: |
          # Use the absolute path to your local private key file
          ssh -i "$PEM_PATH" -o StrictHostKeyChecking=no ubuntu@"$EC2_HOST" << 'EOF'
            echo "Successfully logged into EC2 instance!"
            whoami
            uname -a
            uptime
            ls /var/www/html/
          EOF
