name: Test EC2 SSH Login via Local Path

on:
  workflow_dispatch: # Allows you to manually trigger this workflow from the GitHub Actions tab

jobs:
  ssh-login-test:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Connect to EC2 via SSH and Test Login
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}             # Your EC2 Private or Public IP
          username: ubuntu                          # Your EC2 username
          key_path: ./ubuntu.pem  # Direct local path on your laptop
          port: 22                                  # Default SSH port
          script: |
            echo "Successfully logged into EC2 instance using local .pem key!"
            whoami
            uname -a
            uptime
            ls /var/www/html/
