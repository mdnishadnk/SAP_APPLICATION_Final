name: Deploy MERN Stack to EC2

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy and Build MERN Stack Locally
        run: |
          echo "Starting deployment on EC2 instance..."
          
          # Navigate to home directory
          cd ~
          
          # Clone or update the repository
          if [ -d "SAP_APPLICATION_Final" ]; then
            echo "Repository exists. Pulling latest changes..."
            cd SAP_APPLICATION_Final
            git pull origin main
          else
            echo "Cloning repository..."
            git clone https://github.com/mdnishadnk/SAP_APPLICATION_Final.git
            cd SAP_APPLICATION_Final
          fi

          echo "Setting up and Installing Backend dependencies..."
          cd backend
          npm install

          echo "Restarting Backend with PM2..."
          pm2 restart sap-backend || pm2 start server.js --name "sap-backend"
          pm2 save

          echo "Setting up and Building Frontend..."
          cd ../frontend
          npm install
          npm run build

          echo "Copying Frontend build assets to Nginx web root..."
          sudo rm -rf /var/www/html/*
          sudo cp -r dist/* /var/www/html/

          echo "Testing and restarting Nginx..."
          sudo nginx -t
          sudo systemctl restart nginx

          echo "Deployment script executed successfully!"
